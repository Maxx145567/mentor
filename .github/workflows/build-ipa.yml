name: Build unsigned IPA
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: |
          brew install xcodegen
          xcodegen generate
      - run: |
          xcodebuild -project Mentor.xcodeproj -scheme Mentor \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Mentor.app Payload/
          zip -qr Mentor-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Mentor-unsigned-ipa
          path: Mentor-unsigned.ipa
